<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 貨櫃裝載模擬系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            overflow: hidden;
        }

        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
        }

        .dashboard {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .dashboard-header h1 {
            font-size: 24px;
            color: #2d3748;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #48bb78;
            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #48bb78;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px;
            border-radius: 8px;
            color: white;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .stat-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            background: white;
            border-radius: 3px;
            transition: width 0.5s ease;
            width: 0%;
        }

        .main-content {
            flex: 1;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            overflow: hidden;
        }

        .control-panel {
            background: white;
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .panel-section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        .panel-section:last-child {
            border-bottom: none;
        }

        .panel-section h3 {
            font-size: 16px;
            color: #2d3748;
            margin-bottom: 15px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #4a5568;
            margin-bottom: 5px;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            transition: border-color 0.2s;
        }

        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .cargo-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .cargo-item {
            background: #f7fafc;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .cargo-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .cargo-item-header input {
            flex: 1;
            min-width: 0;
            padding: 4px 8px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
        }

        .cargo-item-remove {
            background: #fc8181;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .cargo-item-remove:hover {
            background: #f56565;
        }

        .cargo-dimensions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .cargo-dimensions input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-size: 12px;
        }

        .cargo-quantity {
            margin-top: 8px;
        }

        .cargo-quantity input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-size: 12px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #2d3748;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }

        .btn-add {
            background: #48bb78;
            color: white;
        }

        .btn-add:hover {
            background: #38a169;
        }

        .btn-example {
            background: #ed8936;
            color: white;
        }

        .btn-example:hover {
            background: #dd6b20;
        }

        .result-summary {
            font-size: 13px;
            line-height: 1.6;
            color: #4a5568;
            background: #f7fafc;
            border-radius: 6px;
            padding: 10px 12px;
            margin-top: 4px;
            display: none;
        }

        .result-summary.visible {
            display: block;
        }

        .result-summary .warn {
            color: #c53030;
            font-weight: 600;
        }

        .result-summary .rec {
            color: #276749;
            font-weight: 600;
        }

        .result-summary .detail {
            color: #718096;
            padding-left: 1.5em;
        }

        /* 每個載具一枚可點的籌碼，內容不可被拆行 */
        .result-summary .chip {
            display: inline-block;
            white-space: nowrap;
            margin: 0 4px 4px 0;
            padding: 1px 6px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-style: normal;
            cursor: pointer;
        }

        .result-summary .chip:hover {
            background: #e2e8f0;
        }

        .result-summary .chip.active {
            background: #667eea;
            border-color: #667eea;
            color: white;
            font-weight: 600;
        }

        .carrier-size {
            font-size: 11px;
            color: #718096;
            white-space: nowrap;
        }

        .result-summary .row {
            margin-top: 6px;
        }

        .carrier-opt {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            font-size: 13px;
            color: #4a5568;
        }

        .carrier-opt input[type="checkbox"] {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            cursor: pointer;
            accent-color: #667eea;
        }

        .carrier-opt .carrier-name {
            flex: 1;
            min-width: 0;
            cursor: pointer;
        }

        .carrier-opt input[type="number"] {
            width: 56px;
            padding: 5px 6px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-size: 12px;
        }

        .field-hint {
            font-size: 11px;
            color: #718096;
            font-weight: normal;
        }

        .viewer-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            background: linear-gradient(to bottom, #e6f2ff 0%, #f0f0f0 100%);
        }

        .viewer-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .control-hint {
            display: flex;
            gap: 20px;
            font-size: 12px;
            color: white;
        }

        .checkbox-group {
            margin-bottom: 12px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #2d3748;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .cargo-options {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            font-size: 12px;
        }

        .cargo-options label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            color: #4a5568;
        }

        .cargo-options input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .webgl-error {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 40px;
            text-align: center;
            color: #c53030;
            font-size: 15px;
            line-height: 1.8;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a0aec0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="dashboard">
            <div class="dashboard-header">
                <h1>🚢 貨櫃裝載模擬系統</h1>
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    <span>系統運行中</span>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">裝載率（已裝載體積 / 貨櫃容量）</div>
                    <div class="stat-value" id="loadPercentage">0%</div>
                    <div class="stat-bar">
                        <div class="stat-bar-fill" id="loadBar"></div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">已裝載體積</div>
                    <div class="stat-value" id="usedSpace">0 m³</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">貨櫃容量</div>
                    <div class="stat-value" id="totalSpace">0 m³</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">貨物數量（已裝載 / 總件數）</div>
                    <div class="stat-value" id="cargoCount">0 件</div>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="control-panel">
                <div class="panel-section">
                    <h3>貨櫃尺寸 (cm)</h3>
                    <div class="input-group">
                        <label>常用櫃型</label>
                        <select id="containerPreset" onchange="applyContainerPreset()">
                            <option value="custom">自訂尺寸</option>
                            <option value="20gp">20 呎標準櫃 (589×235×239)</option>
                            <option value="40gp" selected>40 呎標準櫃 (1203×235×239)</option>
                            <option value="40hq">40 呎高櫃 (1203×235×269)</option>
                            <option value="20rf">20 呎冷藏櫃 (530×228×212)</option>
                            <option value="40rfhq">40 呎 HQ 冷藏櫃 (1130×228×240)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>長度 (L)</label>
                        <input type="number" id="containerLength" value="1203" min="1" oninput="onContainerInputChange()">
                    </div>
                    <div class="input-group">
                        <label>寬度 (W)</label>
                        <input type="number" id="containerWidth" value="235" min="1" oninput="onContainerInputChange()">
                    </div>
                    <div class="input-group">
                        <label>高度 (H)</label>
                        <input type="number" id="containerHeight" value="239" min="1" oninput="onContainerInputChange()">
                    </div>
                </div>

                <div class="panel-section">
                    <h3>貨物清單</h3>
                    <div id="cargoList" class="cargo-list"></div>
                    <button class="btn btn-add" onclick="addCargoItem()">+ 新增貨物</button>
                </div>

                <div class="panel-section">
                    <h3>全域設定</h3>
                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" id="globalStackable" onchange="applyGlobalSettings()">
                            <span>全部可堆疊（允許其他貨物疊於其上）</span>
                        </label>
                    </div>
                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" id="globalRotatable" onchange="applyGlobalSettings()">
                            <span>全部可旋轉（水平旋轉 90°）</span>
                        </label>
                    </div>
                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" id="loadInOrder" onchange="invalidateResult()">
                            <span>依清單順序裝載（先裝清單前面的貨物）</span>
                        </label>
                    </div>
                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" id="spreadEven" onchange="invalidateResult()">
                            <span>平均堆疊至櫃門（自動降低堆疊高度、鋪滿櫃長）</span>
                        </label>
                    </div>
                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" id="showLabels" checked onchange="toggleLabels()">
                            <span>顯示貨物標籤</span>
                        </label>
                    </div>
                </div>

                <div class="panel-section">
                    <button class="btn btn-primary" id="btnCalc" onclick="calculateLoading()">🔄 計算裝載</button>
                    <button class="btn btn-secondary" onclick="resetView()">↻ 重置視角</button>
                    <button class="btn btn-secondary" onclick="clearAll()">🗑️ 清空全部</button>
                    <div id="resultSummary" class="result-summary"></div>
                </div>

                <div class="panel-section">
                    <h3>裝箱快速評估</h3>
                    <div class="input-group">
                        <label>外箱尺寸 長×寬×高 (cm)</label>
                        <div class="cargo-dimensions">
                            <input type="number" placeholder="長" id="evalLength" min="1">
                            <input type="number" placeholder="寬" id="evalWidth" min="1">
                            <input type="number" placeholder="高" id="evalHeight" min="1">
                        </div>
                    </div>
                    <div class="cargo-options" style="margin-bottom: 10px;">
                        <label>
                            <input type="checkbox" id="evalStackable" checked>
                            <span>可堆疊</span>
                        </label>
                        <label>
                            <input type="checkbox" id="evalRotatable" checked>
                            <span>可旋轉</span>
                        </label>
                    </div>
                    <button class="btn btn-secondary" onclick="evaluateRemaining()">📦 評估剩餘空間可再裝幾箱</button>
                    <button class="btn btn-secondary" id="btnFull" onclick="calculateFullCapacity()">🧮 計算空櫃整櫃可裝幾箱</button>
                    <div id="evalResult" class="result-summary"></div>
                </div>

                <div class="panel-section">
                    <h3>多載具配載</h3>
                    <div id="carrierCandidates"></div>
                    <div class="input-group">
                        <label>堆貨高度 (cm)
                            <span class="field-hint">僅套用於棧板；棧板本身 12.5 cm 未計入</span>
                        </label>
                        <input type="number" id="carrierHeight" min="1" placeholder="依客需 / 海空運自行輸入">
                    </div>
                    <button class="btn btn-secondary" id="btnCarrier" onclick="calculateMultiCarrier()">🧮 計算整票貨需要幾個載具</button>
                    <div id="carrierResult" class="result-summary"></div>
                </div>

                <div class="panel-section">
                    <h3>快速範例</h3>
                    <button class="btn btn-example" onclick="loadExample()">載入範例數據</button>
                </div>
            </div>

            <div class="viewer-container">
                <div id="canvas-container"></div>
                <div class="viewer-controls">
                    <div class="control-hint">
                        <span>🖱️ 左鍵拖曳：旋轉</span>
                        <span>🖱️ 右鍵拖曳：平移</span>
                        <span>🖱️ 滾輪：縮放</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
// ============================================================
// 常數
// ============================================================
const EPS = 0.001;          // 浮點比較容差 (cm)
const SUPPORT_RATIO = 0.7;  // 貨物底面積至少需被下方支撐的比例
const FLOOR_T = 5;          // 貨櫃底板顯示厚度 (cm)
const MAX_PIECES = 1500;    // 展開後的貨物件數上限，避免瀏覽器凍結
const GRID_CAP = 10000;     // 候選欄位網格上限，超過時退回箱角欄位以免凍結
const PALLET_DECK_H = 12.5; // 棧板本身高度 (cm)，僅供提示文字，不計入堆貨高度

// 裝載策略。貪婪法對「先填哪個軸」與「先試哪個方位」極度敏感：單一策略會讓
// 120×100 與 100×120 這種物理上等價的問題算出不同件數（實測 12 vs 18）。
// 這 4 個策略在 x↔z 對調下兩兩互為配對（0↔3、1↔2），構成封閉集合，
// 因此取「件數最多者」可讓長寬對調的答案必然一致（貨物可旋轉時）。
const PACK_STRATEGIES = [
    { zFirst: false, rotFirst: false },   // 原始行為：x 軸優先、非旋轉方位優先
    { zFirst: false, rotFirst: true  },
    { zFirst: true,  rotFirst: false },
    { zFirst: true,  rotFirst: true  }
];

const CONTAINER_PRESETS = {
    '20gp': { length: 589,  width: 235, height: 239 },
    '40gp': { length: 1203, width: 235, height: 239 },
    '40hq': { length: 1203, width: 235, height: 269 },
    '20rf': { length: 530,  width: 228, height: 212 },
    '40rfhq': { length: 1130, width: 228, height: 240 }
};

// 多載具配載的候選載具。
// 棧板：長寬可改，高度取自「堆貨高度」欄位（棧板本身 12.5 cm 另計）。
// 貨櫃：尺寸取自櫃型預設或上方輸入欄，用它自己的高度。
const CARRIER_CANDIDATES = [
    { id: 'palletA', name: '棧板 A', pallet: true, length: 120, width: 100, checked: true },
    { id: 'palletB', name: '棧板 B', pallet: true, length: 120, width: 80,  checked: true },
    { id: '20gp',    name: '20 呎標準櫃' },
    { id: '40gp',    name: '40 呎標準櫃', checked: true },
    { id: '40hq',    name: '40 呎高櫃' },
    { id: '20rf',    name: '20 呎冷藏櫃' },
    { id: '40rfhq',  name: '40 呎 HQ 冷藏櫃' },
    { id: 'custom',  name: '上方自訂貨櫃尺寸' }
];

const cargoColors = [
    0x4299e1, // 藍色
    0xf56565, // 紅色
    0x48bb78, // 綠色
    0xed8936, // 橘色
    0x9f7aea, // 紫色
    0xecc94b, // 黃色
    0x38b2ac, // 青色
    0xed64a6  // 粉色
];

// ============================================================
// 全域狀態
// ============================================================
let scene, camera, renderer, controls;
let containerMesh = null;
let cargoMeshes = [];
let labelsGroup = null;
let cargoData = [];
let nextCargoId = 1;
let lastResult = null;   // 最近一次 packCargo 的結果；貨物或貨櫃被修改時設回 null
let evalPlaced = [];     // 「剩餘空間快速評估」目前顯示的金色預覽箱（計入頂部統計）
let containerSize = { length: 1203, width: 235, height: 239 };
let framedSize = null;   // 上次自動取景時的載具尺寸；用來判斷該不該重新取景
let carrierRun = null;   // 最近一次多載具配載的結果與目前顯示中的載具

// ============================================================
// 裝載演算法（純函式，不碰 DOM / THREE）
// 座標系：貨櫃內部角落為原點，x ∈ [0,L]、y ∈ [0,H]、z ∈ [0,W]
// box = { x, y, z, l, h, w }（位置為最小角落，尺寸為長高寬）
// ============================================================
// === PACKING (pure) ===

// 兩個 AABB 是否重疊（貼齊不算重疊）
function boxesOverlap(a, b) {
    return a.x < b.x + b.l - EPS && a.x + a.l > b.x + EPS &&
           a.y < b.y + b.h - EPS && a.y + a.h > b.y + EPS &&
           a.z < b.z + b.w - EPS && a.z + a.w > b.z + EPS;
}

// 底面 (x,z)~(x+l,z+w) 落下後的靜止高度：取footprint範圍內所有箱頂最大值，否則為地板 0。
// 依此構造的位置必然不與既有箱子重疊（footprint 有交集的箱子頂面都 <= y）。
function footprintRestingHeight(x, z, l, w, placed) {
    let y = 0;
    for (const q of placed) {
        if (x < q.x + q.l - EPS && x + l > q.x + EPS &&
            z < q.z + q.w - EPS && z + w > q.z + EPS) {
            y = Math.max(y, q.y + q.h);
        }
    }
    return y;
}

// 支撐與堆疊規則檢查：
// 1. 零覆蓋：不可堆疊箱的正上方（任何高度）不得有其他貨物投影，
//    反向亦然 —— 不可堆疊箱也不能放進已有貨物懸空於其上方的位置
// 2. 貼地成立；否則底面需有 >= SUPPORT_RATIO 比例壓在可堆疊箱頂面上
function isSupported(box, placed) {
    const need = box.l * box.w * SUPPORT_RATIO;
    let area = 0;
    let enough = box.y < EPS;
    for (const q of placed) {
        const ox = Math.min(box.x + box.l, q.x + q.l) - Math.max(box.x, q.x);
        const oz = Math.min(box.z + box.w, q.z + q.w) - Math.max(box.z, q.z);
        if (ox <= EPS || oz <= EPS) continue;
        if (!q.stackable && box.y >= q.y + q.h - EPS) return false;
        if (!box.stackable && q.y >= box.y + box.h - EPS) return false;
        if (q.stackable && Math.abs(q.y + q.h - box.y) <= EPS) {
            area += ox * oz;
            if (area >= need - EPS) enough = true;
        }
    }
    return enough;
}

// 候選欄位：由所有已放箱子的 X 邊界 × Z 邊界組成網格（涵蓋箱角、箱頂與跨箱交會點）。
// 組合數超過 GRID_CAP 時退回箱角欄位，犧牲部分裝載率換取速度。
// 回傳順序即策略的位置優劣順序（zFirst 決定先比哪個軸），findBestPlacement
// 因此可以掃到第一個放得下的欄位就收工。
function buildColumns(placed, cont, zFirst) {
    const round2 = v => Math.round(v * 100) / 100;
    const xs = new Set([0]);
    const zs = new Set([0]);
    for (const q of placed) {
        xs.add(round2(q.x)); xs.add(round2(q.x + q.l));
        zs.add(round2(q.z)); zs.add(round2(q.z + q.w));
    }
    const asc = (a, b) => a - b;
    const xArr = [...xs].filter(v => v >= 0 && v < cont.length - EPS).sort(asc);
    const zArr = [...zs].filter(v => v >= 0 && v < cont.width - EPS).sort(asc);

    const columns = [];
    if (xArr.length * zArr.length <= GRID_CAP) {
        // 巢狀順序就是排序：外層放優先軸，產出即已排好，不必再 sort 一次
        const [outer, inner] = zFirst ? [zArr, xArr] : [xArr, zArr];
        for (const a of outer) {
            for (const b of inner) columns.push(zFirst ? { x: b, z: a } : { x: a, z: b });
        }
    } else {
        columns.push({ x: 0, z: 0 });
        for (const q of placed) {
            columns.push(
                { x: round2(q.x), z: round2(q.z) },
                { x: round2(q.x + q.l), z: round2(q.z) },
                { x: round2(q.x), z: round2(q.z + q.w) },
                { x: round2(q.x + q.l), z: round2(q.z + q.w) }
            );
        }
        columns.sort(zFirst ? (a, b) => a.z - b.z || a.x - b.x
                            : (a, b) => a.x - b.x || a.z - b.z);
    }
    return columns;
}

// 極點啟發式裝載：
// 1. 預設貨物依體積由大到小處理（同型貨物因此連續處理）；
//    opts.sortByVolume === false 時保持傳入順序（模擬「清單前面的貨物先裝」）
// 2. 對每個候選欄位 × 水平方向，計算落下後的靜止高度
// 3. 需在櫃內、有支撐、不壓在不可堆疊箱上；以 (x, z, y) 最小者為最佳位置：
//    同一直柱疊滿到頂才移往下一個位置（垂直優先），如同實際裝櫃一面牆一面牆裝，
//    同型貨物自然形成直柱而非打平分層
// 回傳 { placed: [...box + item], unplaced: [...item] }
function packCargo(items, cont, opts = {}) {
    const placed = [];
    const unplaced = [];
    const st = opts.strategy || PACK_STRATEGIES[0];

    const sorted = opts.sortByVolume === false
        ? [...items]
        : [...items].sort((a, b) =>
            (b.length * b.width * b.height) - (a.length * a.width * a.height) ||
            (b.height - a.height));

    for (const item of sorted) {
        const box = findBestPlacement(item, placed, cont, st);
        if (box) {
            placed.push(box);
        } else {
            unplaced.push(item);
        }
    }

    return { placed, unplaced };
}

// 條帶規劃：把「分割軸」切成前後兩段 —— 前段的貨物全部不旋轉、後段全部旋轉。
//
// 為什麼需要：極點貪婪法在同一個位置面對兩種方位時，分數必然相同，永遠由
// 同一個方位勝出，於是整個載具只會出現單一方位。當載具寬度不是方位寬度的
// 整數倍時，混合方位的條帶明顯更省空間 —— 例如 49.8×35.8 的箱子放進寬 228 cm
// 的 40 呎 HQ 冷藏櫃：單一方位 6 條 × 22 箱 = 132 箱/層，
// 混合成 2 條(寬35.8) + 3 條(寬49.8) 則是 2×22 + 3×31 = 137 箱/層。
//
// 條帶最佳組合是一維背包（兩種寬度填滿一條線段），直接掃 b 的所有可能即為最佳解。
// 只有「混合嚴格優於任一單一方位」時才回傳分割座標，否則回傳 null 省下一次完整試裝。
function bandSplitAt(item, cont, zFirst) {
    if (!item.rotatable || Math.abs(item.length - item.width) <= EPS) return null;
    const wid = zFirst ? cont.width : cont.length;   // 要切成條帶的軸
    const run = zFirst ? cont.length : cont.width;   // 條帶延伸方向的長度
    const pA = zFirst ? item.width : item.length;    // 不旋轉條帶佔用的寬度
    const rA = zFirst ? item.length : item.width;    // 不旋轉時沿條帶方向的邊長
    const nA = Math.floor(run / rA + EPS);           // 不旋轉條帶每條可放幾箱
    const nB = Math.floor(run / pA + EPS);           // 旋轉條帶（寬 rA）每條可放幾箱

    let best = null, uniform = 0;
    for (let b = 0; b * rA <= wid + EPS; b++) {
        const a = Math.floor((wid - b * rA) / pA + EPS);
        const total = a * nA + b * nB;
        if (a === 0 || b === 0) uniform = Math.max(uniform, total);
        if (!best || total > best.total) best = { total, a };
    }
    return best && best.total > uniform ? best.a * pA : null;
}

// 條帶策略：以體積最大的貨物（版面由它決定）規劃，兩個方向各一個。
// 這兩個策略在 x↔z 對調下互為配對，因此「長寬對調結果一致」的封閉性仍然成立。
function bandStrategies(items, cont) {
    const lead = items.reduce((m, it) =>
        (!m || it.length * it.width * it.height > m.length * m.width * m.height) ? it : m, null);
    if (!lead) return [];
    const out = [];
    for (const zFirst of [true, false]) {
        const split = bandSplitAt(lead, cont, zFirst);
        if (split !== null) out.push({ zFirst, rotFirst: false, split });
    }
    return out;
}

// 完整策略集合：4 個基本策略 + 最多 2 個條帶策略。
// 所有「試裝取最多」的入口都必須用這個函式，否則「計算裝載」與
// 「空櫃整櫃可裝」會對同一批貨算出不同答案。
function allStrategies(items, cont) {
    return [...PACK_STRATEGIES, ...bandStrategies(items, cont)];
}

// 跑遍所有策略取裝載件數最多者。這是「長寬對調結果必須一致」的實作核心，
// 回傳值多帶 strategy 供 packCargoSpread 沿用（見該函式的效能註解）。
// 一旦某個策略把貨全裝完就收工 —— 已經沒有更多可裝，其餘策略不可能更好，
// 「取最多」的答案也不會因此改變（長寬對調的對稱性同樣不受影響）。
function packCargoBest(items, cont, opts = {}) {
    let best = null;
    for (const st of allStrategies(items, cont)) {
        const r = packCargo(items, cont, { ...opts, strategy: st });
        if (!best || r.placed.length > best.placed.length) {
            best = { placed: r.placed, unplaced: r.unplaced, strategy: st };
            if (r.unplaced.length === 0) break;
        }
    }
    return best;
}

// 為單一貨物尋找最佳放置位置（不修改 placed）；找不到回傳 null。
// 位置優劣的比較鍵是「策略優先軸 → 次要軸 → 靜止高度 y」。y 排最後即
// 「同一直柱疊滿才換位置」，同型貨物自然形成直柱而非打平分層。
// 「剩餘空間快速評估」也直接以既有 placed 狀態呼叫此函式逐件試放。
function findBestPlacement(item, placed, cont, st = PACK_STRATEGIES[0]) {
    const orientations = [{ l: item.length, w: item.width, rotated: false }];
    if (item.rotatable && Math.abs(item.length - item.width) > EPS) {
        orientations.push({ l: item.width, w: item.length, rotated: true });
    }
    if (st.rotFirst) orientations.reverse();

    // buildColumns 已按位置優劣排序，所以掃到第一個放得下的欄位時，它必然就是最佳解 ——
    // 直接收工，不必掃完全部欄位（實測與掃完全部欄位的佈局逐箱完全相同）。
    const columns = buildColumns(placed, cont, st.zFirst);

    for (const c of columns) {
        // 同一欄位內剩下的比較鍵只有靜止高度 y：取最低者，同高保留先出現的方位
        let best = null;
        for (const o of orientations) {
            // 條帶策略：分割座標之前只准不旋轉、之後只准旋轉（見 bandSplitAt）
            if (st.split !== undefined &&
                o.rotated !== ((st.zFirst ? c.z : c.x) >= st.split - EPS)) continue;
            if (c.x + o.l > cont.length + EPS) continue;
            if (c.z + o.w > cont.width + EPS) continue;

            const y = footprintRestingHeight(c.x, c.z, o.l, o.w, placed);
            if (y + item.height > cont.height + EPS) continue;

            // 高度比較先於支撐檢查，省掉不會勝出的方位
            if (best && y >= best.y - EPS) continue;

            const box = { x: c.x, y: y, z: c.z, l: o.l, h: item.height, w: o.w, stackable: item.stackable };
            if (!isSupported(box, placed)) continue;

            best = { x: c.x, y: y, z: c.z, l: o.l, h: item.height, w: o.w, rotated: o.rotated };
        }

        // 防禦性檢查：構造上不應與既有箱子重疊，若違反則跳過這個欄位
        if (best && !placed.some(p => boxesOverlap(best, p))) {
            return {
                x: best.x, y: best.y, z: best.z,
                l: best.l, h: best.h, w: best.w,
                rotated: best.rotated,
                stackable: item.stackable,
                item: item
            };
        }
    }
    return null;
}

// 貨物高度能組成的「精確」塔高集合（BFS 枚舉高度和，不取整）。
// 演算法中所有高度門檻（靜止高度、支撐面、櫃高截斷）都發生在既有箱頂高度，
// 而箱頂高度必為若干貨物高度之和 —— 因此高度上限只在這些精確值上才會改變
// 裝載結果，兩個相鄰候選之間的截斷結果完全相同。
// 候選數超過 maxCaps（多種高度混裝的組合爆炸）時回傳空陣列，由呼叫端改用網格掃描。
function reachableStackHeights(items, maxHeight, maxCaps) {
    const uniq = [...new Set(items.map(it => it.height))]
        .filter(h => h > EPS && h <= maxHeight + EPS);
    const seen = new Set([0]);
    const sums = [];
    const queue = [0];
    const key = v => Math.round(v * 1000);
    while (queue.length > 0) {
        const s = queue.pop();
        for (const h of uniq) {
            const t = s + h;
            if (t > maxHeight + EPS) continue;
            const k = key(t);
            if (seen.has(k)) continue;
            seen.add(k);
            sums.push(t);
            queue.push(t);
            if (sums.length > maxCaps) return [];
        }
    }
    return sums.sort((a, b) => a - b);
}

// 平均堆疊：在不減少裝載件數的前提下，找出最低的堆疊高度上限，
// 讓貨物以較低的高度從櫃底鋪滿到櫃門（平均分佈），高度隨貨量自動增減。
// 對每個候選上限實際試裝並取「件數最多、同件數時上限最低」者 ——
// 完全不依賴「上限越高裝越多」的單調性假設（垂直優先貪婪法不保證此性質）。
// 候選來源：精確塔高集合；組合爆炸時退回均勻網格掃描（上限可能非最低，
// 但同樣取最佳觀察值，件數保證不少於滿高度基準）。
// 回傳 { placed, unplaced, heightCap }
function packCargoSpread(items, cont, opts = {}) {
    const base = packCargoBest(items, cont, opts);
    if (base.placed.length === 0) {
        return { placed: base.placed, unplaced: base.unplaced, heightCap: cont.height };
    }

    // 高度上限掃描沿用 base 選出的那一個策略。若每個上限都重跑 4 策略，
    // 最壞情況（25 個上限 × 4 策略）會讓大批貨算到瀏覽器凍結（實測 1500 件約 68 秒）。
    // 候選高度集合只由貨物高度決定、與 L/W 無關，因此長寬對調的對稱性仍然成立。
    const capOpts = { ...opts, strategy: base.strategy };

    let caps = reachableStackHeights(items, cont.height, 24);
    if (caps.length === 0) {
        const minH = Math.min(...items.map(it => it.height));
        caps = [];
        for (let i = 0; i <= 16; i++) {
            caps.push(minH + (cont.height - minH) * i / 16);
        }
    }

    let best = { placed: base.placed, unplaced: base.unplaced, heightCap: cont.height };
    for (const cap of caps) {
        const r = packCargo(items, { length: cont.length, width: cont.width, height: cap }, capOpts);
        if (r.placed.length > best.placed.length ||
            (r.placed.length === best.placed.length && cap < best.heightCap)) {
            best = { placed: r.placed, unplaced: r.unplaced, heightCap: cap };
        }
    }
    return best;
}

// 收尾用：在「一件都不能少」的前提下把貨堆得最低。
// 由低往高試候選塔高，第一個能全裝的就是答案 —— 於是 13 箱會鋪成 5+5+3 三層，
// 而不是堆成一根 4 層高柱。每個塔高都重跑完整策略集合（不像 packCargoSpread
// 沿用單一策略），因為「每層放幾箱」正是策略之間差最多的地方。
// 起點用體積下界剪枝（貨物體積 / 載具底面積），跳過必然裝不完的低塔高；
// 同型貨物的候選塔高只有「層數」那幾個，因此實際只會試 1～3 次。
// 找不到（高度種類太多導致候選集合放棄）時回傳 null，由呼叫端保留原本的裝法。
function packLowestStack(items, cont, opts = {}) {
    const caps = reachableStackHeights(items, cont.height, 24);
    if (caps.length === 0) return null;

    const vol = items.reduce((s, it) => s + it.length * it.width * it.height, 0);
    const minCap = vol / (cont.length * cont.width);
    for (const cap of caps) {
        if (cap < minCap - EPS) continue;
        const r = packCargoBest(items, { ...cont, height: cap }, opts);
        if (r.placed.length === items.length) return r.placed;
    }
    return null;
}

// 貨物在「空載具」中是否至少有一種擺法放得下
function fitsInEmpty(item, cont) {
    if (item.height > cont.height + EPS) return false;
    if (item.length <= cont.length + EPS && item.width <= cont.width + EPS) return true;
    return item.rotatable &&
           item.width <= cont.length + EPS && item.length <= cont.width + EPS;
}

// 多載具配載：一個載具裝不完就開下一個，直到整票貨裝完。
// 先濾掉「空載具都放不下」的貨物 —— 剩下的每一件都保證能單獨放進空載具，
// 因此每一輪至少裝進 1 件，迴圈必然終止。不需要人為的載具數上限，
// 也不需要「這輪裝了 0 件就 break」的補丁分支。
// 回傳 { carriers: [[box, ...], ...], oversized: [item, ...] }
function packMultiCarrier(items, cont, opts = {}) {
    const oversized = items.filter(it => !fitsInEmpty(it, cont));
    let remaining = items.filter(it => fitsInEmpty(it, cont));

    const carriers = [];
    while (remaining.length > 0) {
        const r = packCargoBest(remaining, cont, opts);
        carriers.push(r.placed);
        remaining = r.unplaced;
    }

    // 最後一個載具通常裝不滿，改成堆最低：剩下的貨橫向鋪成幾個矮層（13 箱 → 5+5+3），
    // 而不是堆成一根孤零零的高柱 —— 實際裝櫃就是這樣疊的。
    // packLowestStack 保證件數不變，因此絕不會讓載具數量變多。
    const last = carriers.length - 1;
    if (last >= 0) {
        const flat = packLowestStack(carriers[last].map(b => b.item), cont, opts);
        if (flat) carriers[last] = flat;
    }
    return { carriers, oversized };
}
// === END PACKING ===

// Three.js 場景

function initScene() {
    const container = document.getElementById('canvas-container');
    const width = container.clientWidth;
    const height = container.clientHeight;

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f0f0);

    camera = new THREE.PerspectiveCamera(45, width / height, 1, 10000);
    camera.position.set(2000, 1500, 2000);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(width, height);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    frameContainer();

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight1.position.set(1000, 2000, 1000);
    directionalLight1.castShadow = true;
    directionalLight1.shadow.mapSize.width = 2048;
    directionalLight1.shadow.mapSize.height = 2048;
    directionalLight1.shadow.camera.left = -1500;
    directionalLight1.shadow.camera.right = 1500;
    directionalLight1.shadow.camera.top = 1500;
    directionalLight1.shadow.camera.bottom = -1500;
    scene.add(directionalLight1);

    const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
    directionalLight2.position.set(-1000, 1000, -1000);
    scene.add(directionalLight2);

    const gridHelper = new THREE.GridHelper(3000, 30, 0x888888, 0xcccccc);
    gridHelper.position.y = -10;
    scene.add(gridHelper);

    labelsGroup = new THREE.Group();
    scene.add(labelsGroup);

    window.addEventListener('resize', onWindowResize);
    animate();
}

// 依載具尺寸自動取景。1203 cm 貨櫃與 120 cm 棧板差了十倍，固定的相機距離
// 與縮放範圍只能服務其中一種，切換載具時另一種不是小如芝麻就是撐爆畫面。
// 只在尺寸與上次取景時不同才動相機 —— 尺寸沒變就代表使用者自己調的視角仍然合用，不該搶走。
function frameDistance(size) {
    return Math.max(size.length, size.width, size.height) * 1.6 + 200;
}

function frameContainer() {
    const { length, width, height } = containerSize;
    if (framedSize && framedSize.length === length &&
        framedSize.width === width && framedSize.height === height) return;
    framedSize = { length, width, height };

    const dist = frameDistance(containerSize);
    camera.position.set(dist, dist * 0.75, dist);
    controls.minDistance = Math.max(20, Math.max(length, width, height) * 0.15);
    controls.maxDistance = dist * 4;
    controls.target.set(0, height / 2, 0);
    controls.update();
    controls.saveState();
}

// 標籤是世界座標下的固定尺寸貼片，寫死的大小只服務得了一種載具：
// 對 1203 cm 貨櫃剛好，放到 120 cm 棧板上就大得蓋住整個畫面。
// 依取景距離等比縮放，讓標籤在任何載具上看起來一樣大；
// 基準取 40 呎櫃，因此既有的貨櫃外觀完全不變。
const LABEL_BASE_DIST = frameDistance({ length: 1203, width: 235, height: 239 });

function labelScale() {
    return frameDistance(containerSize) / LABEL_BASE_DIST;
}

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}

function onWindowResize() {
    if (!renderer) return;
    const container = document.getElementById('canvas-container');
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
}

// 釋放物件底下所有 geometry / material / texture，避免重複計算時洩漏 GPU 資源
function disposeObject(obj) {
    obj.traverse(child => {
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            mats.forEach(m => {
                if (m.map) m.map.dispose();
                m.dispose();
            });
        }
    });
}

function clearCargoMeshes() {
    cargoMeshes.forEach(mesh => {
        scene.remove(mesh);
        disposeObject(mesh);
    });
    cargoMeshes = [];

    while (labelsGroup.children.length > 0) {
        const sprite = labelsGroup.children[0];
        labelsGroup.remove(sprite);
        disposeObject(sprite);
    }
}

function createContainer() {
    if (containerMesh) {
        scene.remove(containerMesh);
        disposeObject(containerMesh);
    }

    const { length, width, height } = containerSize;
    const containerGroup = new THREE.Group();

    const bottomGeometry = new THREE.BoxGeometry(length, FLOOR_T, width);
    const bottomMaterial = new THREE.MeshStandardMaterial({
        color: 0x8b7355,
        metalness: 0.3,
        roughness: 0.7
    });
    const bottom = new THREE.Mesh(bottomGeometry, bottomMaterial);
    bottom.position.y = FLOOR_T / 2;
    bottom.receiveShadow = true;
    containerGroup.add(bottom);

    const wallMaterial = new THREE.MeshStandardMaterial({
        color: 0x4a5568,
        metalness: 0.5,
        roughness: 0.5,
        transparent: true,
        opacity: 0.3
    });
    const backWall = new THREE.Mesh(new THREE.BoxGeometry(length, height, 5), wallMaterial);
    backWall.position.set(0, FLOOR_T + height / 2, -width / 2 - 2.5);
    containerGroup.add(backWall);

    const edges = new THREE.EdgesGeometry(new THREE.BoxGeometry(length, height, width));
    const lineMaterial = new THREE.LineBasicMaterial({ color: 0x2d3748 });
    const wireframe = new THREE.LineSegments(edges, lineMaterial);
    wireframe.position.y = FLOOR_T + height / 2;
    containerGroup.add(wireframe);

    containerMesh = containerGroup;
    scene.add(containerMesh);
}

// 裝載座標（角落原點）→ 場景座標（貨櫃中心在原點、底板上方）
function toSceneCoords(box) {
    return {
        x: box.x + box.l / 2 - containerSize.length / 2,
        y: box.y + box.h / 2 + FLOOR_T,
        z: box.z + box.w / 2 - containerSize.width / 2
    };
}

function createCargoBox(pos) {
    const geometry = new THREE.BoxGeometry(pos.length, pos.height, pos.width);
    const material = new THREE.MeshStandardMaterial({
        color: pos.color,
        metalness: 0.2,
        roughness: 0.8,
        transparent: !pos.loaded || !pos.stackable,
        opacity: !pos.loaded ? 0.5 : (pos.stackable ? 1 : 0.75)
    });

    const box = new THREE.Mesh(geometry, material);
    box.position.set(pos.x, pos.y, pos.z);
    box.castShadow = true;
    box.receiveShadow = true;

    let edgeColor;
    if (!pos.loaded) {
        edgeColor = 0xff0000;      // 紅色：無法裝載
    } else if (!pos.stackable) {
        edgeColor = 0xff6600;      // 橘紅色：不可堆疊
    } else {
        edgeColor = 0x000000;
    }
    const edges = new THREE.EdgesGeometry(geometry);
    const lineMaterial = new THREE.LineBasicMaterial({ color: edgeColor });
    box.add(new THREE.LineSegments(edges, lineMaterial));

    scene.add(box);
    cargoMeshes.push(box);

    const tags = [];
    if (!pos.loaded) tags.push('無法裝載');
    else {
        if (!pos.stackable) tags.push('不可堆疊');
        if (pos.rotated) tags.push('已旋轉');
    }
    const line1 = pos.name + (tags.length ? ` [${tags.join('、')}]` : '');
    const line2 = `${Math.round(pos.length)}×${Math.round(pos.width)}×${Math.round(pos.height)}`;
    const s = labelScale();
    createLabel(line1, line2, pos.x, pos.y + pos.height / 2 + 35 * s, pos.z, s);
}

function createLabel(line1, line2, x, y, z, scale = 1) {
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 96;
    const context = canvas.getContext('2d');

    context.fillStyle = 'rgba(255, 255, 255, 0.85)';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.textAlign = 'center';
    context.textBaseline = 'middle';
    context.fillStyle = 'black';
    context.font = 'Bold 24px Arial';
    context.fillText(line1, canvas.width / 2, 30);
    context.fillStyle = '#555';
    context.font = '20px Arial';
    context.fillText(line2, canvas.width / 2, 66);

    const texture = new THREE.CanvasTexture(canvas);
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture }));
    sprite.position.set(x, y, z);
    sprite.scale.set(110 * scale, 41 * scale, 1);
    labelsGroup.add(sprite);
}

function toggleLabels() {
    if (labelsGroup) {
        labelsGroup.visible = document.getElementById('showLabels').checked;
    }
}

// ============================================================
// 裝載流程
// ============================================================
function readContainerInputs() {
    return {
        length: parseFloat(document.getElementById('containerLength').value),
        width: parseFloat(document.getElementById('containerWidth').value),
        height: parseFloat(document.getElementById('containerHeight').value)
    };
}

// 依 quantity 展開為單件清單，顏色依貨物種類固定
function expandCargo() {
    const expanded = [];
    cargoData.forEach((cargo, typeIndex) => {
        const qty = Math.max(1, Math.round(cargo.quantity || 1));
        for (let i = 0; i < qty; i++) {
            expanded.push({
                name: qty > 1 ? `${cargo.name}-${i + 1}` : cargo.name,
                length: cargo.length,
                width: cargo.width,
                height: cargo.height,
                stackable: cargo.stackable,
                rotatable: cargo.rotatable,
                color: cargoColors[typeIndex % cargoColors.length]
            });
        }
    });
    return expanded;
}

// 這幾個計算會佔住主執行緒數秒（1500 件整櫃約 3 秒、多載具勾滿櫃型約 5 秒）。
// 直接跑的話瀏覽器連按鈕都來不及重畫，使用者只看到整頁凍住。
// 先把按鈕改成「計算中」，等瀏覽器真的畫過一幀（雙重 rAF）再開始算。
function runBusy(btnId, work) {
    const btn = document.getElementById(btnId);
    const label = btn.textContent;
    btn.textContent = '⏳ 計算中…';
    btn.disabled = true;
    requestAnimationFrame(() => requestAnimationFrame(() => {
        try {
            work();
        } finally {
            btn.textContent = label;
            btn.disabled = false;
        }
    }));
}

function calculateLoading()      { runBusy('btnCalc',    doCalculateLoading); }
function calculateFullCapacity() { runBusy('btnFull',    doCalculateFullCapacity); }
function calculateMultiCarrier() { runBusy('btnCarrier', doCalculateMultiCarrier); }

function doCalculateLoading() {
    updateCargoData();

    if (cargoData.length === 0) {
        alert('請先添加貨物！');
        return;
    }

    const cont = readContainerInputs();
    if (!(cont.length > 0 && cont.width > 0 && cont.height > 0)) {
        alert('貨櫃尺寸必須大於 0！');
        return;
    }
    for (const c of cargoData) {
        if (!(c.length > 0 && c.width > 0 && c.height > 0)) {
            alert(`貨物「${c.name}」的尺寸必須大於 0！`);
            return;
        }
    }

    const expanded = expandCargo();
    if (expanded.length > MAX_PIECES) {
        alert(`貨物總件數 ${expanded.length} 超過上限 ${MAX_PIECES} 件，請減少數量。`);
        return;
    }

    containerSize = cont;
    createContainer();
    frameContainer();

    const packOpts = { sortByVolume: !document.getElementById('loadInOrder').checked };
    lastResult = document.getElementById('spreadEven').checked
        ? packCargoSpread(expanded, containerSize, packOpts)
        : packCargoBest(expanded, containerSize, packOpts);

    renderScene();
    updateStats();
    showResultSummary();
}

// 依 lastResult 重繪櫃內貨物與櫃外未裝載貨物（也會清掉評估預覽）
function renderScene() {
    clearCargoMeshes();
    evalPlaced = [];
    document.getElementById('evalResult').classList.remove('visible');
    if (!lastResult) return;

    lastResult.placed.forEach(b => {
        const p = toSceneCoords(b);
        createCargoBox({
            x: p.x, y: p.y, z: p.z,
            length: b.l, width: b.w, height: b.h,
            name: b.item.name,
            color: b.item.color,
            stackable: b.item.stackable,
            rotated: b.rotated,
            loaded: true
        });
    });

    // 無法裝載的貨物以灰色排列在貨櫃右側（+X 方向）
    let outsideX = containerSize.length / 2 + 100;
    let outsideZ = -containerSize.width / 2;
    let rowMaxWidth = 0;
    const rowLimit = containerSize.length / 2 + 900;

    lastResult.unplaced.forEach(item => {
        if (outsideX + item.length > rowLimit && rowMaxWidth > 0) {
            outsideX = containerSize.length / 2 + 100;
            outsideZ += rowMaxWidth + 40;
            rowMaxWidth = 0;
        }
        createCargoBox({
            x: outsideX + item.length / 2,
            y: item.height / 2 + FLOOR_T,
            z: outsideZ + item.width / 2,
            length: item.length, width: item.width, height: item.height,
            name: item.name,
            color: 0x888888,
            stackable: item.stackable,
            rotated: false,
            loaded: false
        });
        outsideX += item.length + 30;
        rowMaxWidth = Math.max(rowMaxWidth, item.width);
    });

    toggleLabels();
}

// 依高度把箱子分層並描述每層件數。
// 實心貨堆從外面只看得到表面，光看 3D 畫面很容易少算一整排 ——
// 印出分層件數，使用者才能對著畫面核對數字。
function describeLayers(boxes) {
    const layers = new Map();
    boxes.forEach(b => {
        const y = Math.round(b.y * 100) / 100;
        layers.set(y, (layers.get(y) || 0) + 1);
    });
    const counts = [...layers.entries()].sort((a, b) => a[0] - b[0]).map(([, n]) => n);
    if (counts.length <= 1) return `一層 ${counts[0] || 0} 箱`;
    if (counts.length > 12) return `分 ${counts.length} 層`;
    return `分 ${counts.length} 層：${counts.join(' + ')} 箱`;
}

// 剩餘空間快速評估：在目前裝載結果上逐件試放新貨尺寸，金色預覽顯示
function evaluateRemaining() {
    if (!lastResult) {
        alert('請先按「計算裝載」建立目前的裝載狀態！');
        return;
    }
    const l = parseFloat(document.getElementById('evalLength').value);
    const w = parseFloat(document.getElementById('evalWidth').value);
    const h = parseFloat(document.getElementById('evalHeight').value);
    if (!(l > 0 && w > 0 && h > 0)) {
        alert('請輸入有效的評估貨物尺寸！');
        return;
    }
    const stackable = document.getElementById('evalStackable').checked;
    const rotatable = document.getElementById('evalRotatable').checked;

    renderScene(); // 還原畫面，清掉上一次的評估預覽

    // 逐一策略在既有裝載狀態上試填，取塞得最多者（同 packCargoBest，讓長寬對調結果一致）
    const limit = Math.max(0, MAX_PIECES - lastResult.placed.length);
    const evalItem = { length: l, width: w, height: h, stackable: stackable, rotatable: rotatable };
    let added = [];
    for (const st of allStrategies([evalItem], containerSize)) {
        const placed = [...lastResult.placed];
        const cur = [];
        while (cur.length < limit) {
            const box = findBestPlacement({
                ...evalItem,
                name: `新貨-${cur.length + 1}`,
                color: 0xffc107
            }, placed, containerSize, st);
            if (!box) break;
            placed.push(box);
            cur.push(box);
        }
        if (cur.length > added.length) added = cur;
    }

    added.forEach(b => {
        const p = toSceneCoords(b);
        createCargoBox({
            x: p.x, y: p.y, z: p.z,
            length: b.l, width: b.w, height: b.h,
            name: b.item.name,
            color: 0xffc107,
            stackable: b.stackable,
            rotated: b.rotated,
            loaded: true
        });
    });
    toggleLabels();

    evalPlaced = added;
    updateStats();

    const vol = added.reduce((s, b) => s + b.l * b.h * b.w, 0) / 1e6;
    const resultDiv = document.getElementById('evalResult');
    resultDiv.innerHTML =
        `📦 剩餘空間可再裝 <b>${added.length}</b> 箱（${l}×${w}×${h} cm，${vol.toFixed(2)} m³）` +
        `<br>${describeLayers(added)}` +
        `<br>金色箱子為評估預覽，已計入上方統計；重新計算裝載即清除`;
    resultDiv.classList.add('visible');
}

// 空櫃整櫃可裝計算：忽略貨物清單，以評估欄位的外箱尺寸填滿整個空貨櫃
function doCalculateFullCapacity() {
    const cont = readContainerInputs();
    if (!(cont.length > 0 && cont.width > 0 && cont.height > 0)) {
        alert('貨櫃尺寸必須大於 0！');
        return;
    }
    const l = parseFloat(document.getElementById('evalLength').value);
    const w = parseFloat(document.getElementById('evalWidth').value);
    const h = parseFloat(document.getElementById('evalHeight').value);
    if (!(l > 0 && w > 0 && h > 0)) {
        alert('請輸入有效的外箱尺寸！');
        return;
    }
    const stackable = document.getElementById('evalStackable').checked;
    const rotatable = document.getElementById('evalRotatable').checked;

    containerSize = cont;
    createContainer();
    frameContainer();

    // 逐一策略填滿空櫃，取裝最多者（同 packCargoBest，讓長寬對調結果一致）
    const boxItem = { length: l, width: w, height: h, stackable: stackable, rotatable: rotatable };
    let placed = [];
    for (const st of allStrategies([boxItem], containerSize)) {
        const cur = [];
        while (cur.length < MAX_PIECES) {
            const box = findBestPlacement({
                ...boxItem,
                name: `箱-${cur.length + 1}`,
                color: 0xffc107
            }, cur, containerSize, st);
            if (!box) break;
            cur.push(box);
        }
        if (cur.length > placed.length) placed = cur;
    }

    lastResult = { placed: placed, unplaced: [] };
    renderScene();
    updateStats();
    showResultSummary();

    const vol = placed.reduce((s, b) => s + b.l * b.h * b.w, 0) / 1e6;
    const capped = placed.length >= MAX_PIECES;
    const resultDiv = document.getElementById('evalResult');
    resultDiv.innerHTML =
        `🧮 空櫃整櫃可裝 <b>${placed.length}${capped ? '+' : ''}</b> 箱（${l}×${w}×${h} cm，${vol.toFixed(2)} m³）` +
        (capped ? `<br><span class="warn">已達 ${MAX_PIECES} 件計算上限</span>` : '') +
        `<br>${describeLayers(placed)}` +
        `<br>此計算忽略貨物清單，以空櫃裝滿為準`;
    resultDiv.classList.add('visible');
}

// ============================================================
// 多載具配載：整票貨裝不完一個載具時，要幾個載具才裝得完
// ============================================================
// 依 CARRIER_CANDIDATES 產生勾選列。棧板列可編輯長寬，貨櫃列只顯示固定尺寸。
function buildCarrierRows() {
    document.getElementById('carrierCandidates').innerHTML =
        CARRIER_CANDIDATES.map(c => {
            const size = c.pallet
                ? `<input type="number" id="cL-${c.id}" value="${c.length}" min="1">` +
                  `<span>×</span>` +
                  `<input type="number" id="cW-${c.id}" value="${c.width}" min="1">`
                : `<span class="carrier-size">${describeCarrier(c)}</span>`;
            return `<div class="carrier-opt">` +
                   `<input type="checkbox" id="cUse-${c.id}"${c.checked ? ' checked' : ''}>` +
                   `<label class="carrier-name" for="cUse-${c.id}">${c.name}</label>${size}</div>`;
        }).join('');
}

function describeCarrier(c) {
    const p = CONTAINER_PRESETS[c.id];
    return p ? `${p.length}×${p.width}×${p.height}` : '';
}

// 讀取勾選的候選載具。棧板共用「堆貨高度」欄位，貨櫃用它自己的高度。
function readCarrierCandidates() {
    const stackHeight = parseFloat(document.getElementById('carrierHeight').value);
    const list = [];
    for (const c of CARRIER_CANDIDATES) {
        if (!document.getElementById(`cUse-${c.id}`).checked) continue;
        if (c.pallet) {
            list.push({
                name: c.name, pallet: true, height: stackHeight,
                length: parseFloat(document.getElementById(`cL-${c.id}`).value),
                width: parseFloat(document.getElementById(`cW-${c.id}`).value)
            });
        } else {
            const size = CONTAINER_PRESETS[c.id] || readContainerInputs();
            list.push({ name: c.name, pallet: false, ...size });
        }
    }
    return list;
}

// 候選排名：能把整票貨裝完者優先 → 載具數少者 → 總佔地面積小者
function rankCarrierResults(results) {
    const key = r => [r.oversized.length > 0 ? 1 : 0, r.carriers.length, r.baseArea];
    return [...results].sort((a, b) => {
        const ka = key(a), kb = key(b);
        return ka[0] - kb[0] || ka[1] - kb[1] || ka[2] - kb[2];
    });
}

function doCalculateMultiCarrier() {
    updateCargoData();

    if (cargoData.length === 0) {
        alert('請先添加貨物！');
        return;
    }
    for (const c of cargoData) {
        if (!(c.length > 0 && c.width > 0 && c.height > 0)) {
            alert(`貨物「${c.name}」的尺寸必須大於 0！`);
            return;
        }
    }

    const candidates = readCarrierCandidates();
    if (candidates.length === 0) {
        alert('請至少勾選一種載具！');
        return;
    }
    for (const cand of candidates) {
        if (!(cand.length > 0 && cand.width > 0 && cand.height > 0)) {
            alert(cand.pallet
                ? `「${cand.name}」尺寸無效 —— 堆貨高度是否已填寫？`
                : `「${cand.name}」的長寬高必須大於 0！`);
            return;
        }
    }

    const expanded = expandCargo();
    if (expanded.length > MAX_PIECES) {
        alert(`貨物總件數 ${expanded.length} 超過上限 ${MAX_PIECES} 件，請減少數量。`);
        return;
    }

    // 前面的載具採「裝滿為先」（要回答的是「最少要幾個載具」），
    // 只有裝不滿的最後一個改成平均堆疊，見 packMultiCarrier
    const packOpts = { sortByVolume: !document.getElementById('loadInOrder').checked };
    const results = candidates.map(cand => {
        const r = packMultiCarrier(expanded, cand, packOpts);
        const capacity = cand.length * cand.width * cand.height;
        return {
            carrier: cand,
            carriers: r.carriers,
            oversized: r.oversized,
            // 實際堆到多高（箱頂最大值），不是使用者輸入的高度上限
            heights: r.carriers.map(c => Math.max(0, ...c.map(b => b.y + b.h))),
            rates: r.carriers.map(c =>
                c.reduce((s, b) => s + b.l * b.w * b.h, 0) / capacity * 100),
            baseArea: r.carriers.length * cand.length * cand.width
        };
    });

    carrierRun = {
        ranked: rankCarrierResults(results),
        totalPieces: expanded.length,
        activeR: 0,
        activeC: 0
    };

    if (carrierRun.ranked[0].carriers.length > 0) {
        showCarrierIn(0, 0);
    } else {
        renderCarrierSummary();
    }
}

// 在 3D 畫出第 ri 名載具的第 ci 個。灰色只保留「任何擺法都放不下」的貨物 ——
// 要裝進其他載具的貨不算未裝載，由報表交代。
function showCarrierIn(ri, ci) {
    if (!carrierRun) return;
    const r = carrierRun.ranked[ri];
    if (!r || !r.carriers[ci]) return;

    containerSize = { length: r.carrier.length, width: r.carrier.width, height: r.carrier.height };
    document.getElementById('containerPreset').value = 'custom';
    document.getElementById('containerLength').value = containerSize.length;
    document.getElementById('containerWidth').value = containerSize.width;
    document.getElementById('containerHeight').value = containerSize.height;
    createContainer();
    frameContainer();

    lastResult = { placed: r.carriers[ci], unplaced: r.oversized };
    renderScene();
    updateStats();
    document.getElementById('resultSummary').classList.remove('visible');

    carrierRun.activeR = ri;
    carrierRun.activeC = ci;
    renderCarrierSummary();
}

const round1 = v => Math.round(v * 10) / 10;

// 實際堆到多高 —— 這是箱頂的真實高度，不是使用者輸入的高度上限。
// 各載具可能不同（最後一個常較矮），相同時只印一個值。
function describeStackHeight(r) {
    const lo = Math.min(...r.heights);
    const hi = Math.max(...r.heights);
    const span = (a, b) => a === b ? `${round1(a)}` : `${round1(a)}~${round1(b)}`;
    let s = `實際堆高 ${span(lo, hi)} cm`;
    if (r.carrier.pallet) {
        s += `，連棧板總高 ${span(lo + PALLET_DECK_H, hi + PALLET_DECK_H)} cm`;
    }
    return s;
}

function renderCarrierSummary() {
    const { ranked, totalPieces, activeR, activeC } = carrierRun;
    let html = `📊 整票貨 <b>${totalPieces}</b> 件的配載結果`;

    ranked.forEach((r, ri) => {
        const c = r.carrier;
        html += `<div class="row${ri === 0 ? ' rec' : ''}">` +
                `${ri === 0 ? '🏆 ' : '　'}${c.name} ${c.length}×${c.width}×${c.height} cm` +
                ` — 需 <b>${r.carriers.length}</b> 個</div>`;
        if (r.carriers.length > 0) {
            html += `<div class="detail">${describeStackHeight(r)}</div>`;
            html += `<div class="detail">` + r.carriers.map((boxes, ci) =>
                `<em class="chip${ri === activeR && ci === activeC ? ' active' : ''}"` +
                ` onclick="showCarrierIn(${ri}, ${ci})"` +
                ` title="第 ${ci + 1} 個：${boxes.length} 件，實際堆高 ${round1(r.heights[ci])} cm，` +
                `裝載率 ${r.rates[ci].toFixed(0)}%　（點擊在 3D 顯示）">` +
                `#${ci + 1} ${boxes.length}件 ${r.rates[ci].toFixed(0)}%</em>`).join('') + `</div>`;
        }
        if (r.oversized.length > 0) {
            html += `<div class="detail warn">⚠️ ${r.oversized.length} 件任何擺法都放不下此載具</div>`;
        }
    });

    if (document.getElementById('spreadEven').checked) {
        html += `<div class="row detail">※ 前面的載具「裝滿為先」；裝不滿的最後一個改為平均堆疊，橫向鋪平</div>`;
    }

    const act = ranked[activeR];
    if (act && act.carriers[activeC]) {
        html += `<div class="row">🖼️ 3D 顯示「${act.carrier.name}」#${activeC + 1}` +
                `（${act.carriers[activeC].length} 件，堆高 ${round1(act.heights[activeC])} cm，` +
                `${describeLayers(act.carriers[activeC])}）` +
                `<br>點上方任一編號可切換載具；按「🔄 計算裝載」切回貨櫃</div>`;
    }

    const div = document.getElementById('carrierResult');
    div.innerHTML = html;
    div.classList.add('visible');
}

function showResultSummary() {
    const summary = document.getElementById('resultSummary');
    if (!lastResult) {
        summary.classList.remove('visible');
        return;
    }
    const loaded = lastResult.placed.length;
    const total = loaded + lastResult.unplaced.length;
    let html = `✅ 已裝載 <b>${loaded}/${total}</b> 件`;
    if (lastResult.unplaced.length > 0) {
        html += `<br><span class="warn">⚠️ ${lastResult.unplaced.length} 件無法裝入</span>（灰色顯示於貨櫃右側）`;
    }
    if (lastResult.heightCap !== undefined && lastResult.heightCap < containerSize.height - 1) {
        html += `<br>📏 平均堆疊生效：堆疊高度上限 ≈ ${Math.ceil(lastResult.heightCap)} cm`;
    }
    summary.innerHTML = html;
    summary.classList.add('visible');
}

function updateStats() {
    const cont = readContainerInputs();
    const contVolume = (cont.length > 0 && cont.width > 0 && cont.height > 0)
        ? cont.length * cont.width * cont.height / 1e6
        : 0;

    let totalPieces;
    let loadedVolume = 0;
    let loadedPieces = 0;
    if (lastResult) {
        lastResult.placed.forEach(b => { loadedVolume += b.l * b.w * b.h / 1e6; });
        evalPlaced.forEach(b => { loadedVolume += b.l * b.w * b.h / 1e6; });
        loadedPieces = lastResult.placed.length + evalPlaced.length;
        totalPieces = lastResult.placed.length + lastResult.unplaced.length + evalPlaced.length;
    } else {
        totalPieces = cargoData.reduce(
            (sum, c) => sum + Math.max(1, Math.round(c.quantity || 1)), 0);
    }

    const pct = contVolume > 0 ? Math.min(100, loadedVolume / contVolume * 100) : 0;

    document.getElementById('loadPercentage').textContent = pct.toFixed(1) + '%';
    document.getElementById('loadBar').style.width = pct + '%';
    document.getElementById('usedSpace').textContent = loadedVolume.toFixed(2) + ' m³';
    document.getElementById('totalSpace').textContent = contVolume.toFixed(2) + ' m³';
    document.getElementById('cargoCount').textContent = lastResult
        ? `${loadedPieces}/${totalPieces} 件`
        : `${totalPieces} 件`;
}

// ============================================================
// UI 控制
// ============================================================
function applyContainerPreset() {
    const preset = CONTAINER_PRESETS[document.getElementById('containerPreset').value];
    if (!preset) return;
    document.getElementById('containerLength').value = preset.length;
    document.getElementById('containerWidth').value = preset.width;
    document.getElementById('containerHeight').value = preset.height;
    syncContainerMesh();
    invalidateResult();
}

function onContainerInputChange() {
    document.getElementById('containerPreset').value = 'custom';
    syncContainerMesh();
    invalidateResult();
}

// 貨櫃尺寸輸入變動時，即時重繪貨櫃外框
function syncContainerMesh() {
    if (!scene) return;
    const cont = readContainerInputs();
    if (!(cont.length > 0 && cont.width > 0 && cont.height > 0)) return;
    containerSize = cont;
    createContainer();
    controls.target.set(0, containerSize.height / 2, 0);
}

// 貨物或貨櫃被修改後，之前的裝載結果不再有效：
// 同步清除畫面上的舊貨物，避免統計歸零但畫面仍顯示舊結果的不一致
function invalidateResult() {
    if (lastResult && scene) clearCargoMeshes();
    lastResult = null;
    evalPlaced = [];
    carrierRun = null;
    document.getElementById('evalResult').classList.remove('visible');
    document.getElementById('carrierResult').classList.remove('visible');
    updateStats();
    showResultSummary();
}

function createCargoRow(cargo) {
    const cargoItem = document.createElement('div');
    cargoItem.className = 'cargo-item';
    cargoItem.id = `cargo-${cargo.id}`;
    cargoItem.innerHTML = `
        <div class="cargo-item-header">
            <input type="text" placeholder="貨物名稱" id="name-${cargo.id}">
            <button class="cargo-item-remove" onclick="removeCargoItem(${cargo.id})">✕</button>
        </div>
        <div class="cargo-dimensions">
            <input type="number" placeholder="長 (cm)" id="length-${cargo.id}" min="1">
            <input type="number" placeholder="寬 (cm)" id="width-${cargo.id}" min="1">
            <input type="number" placeholder="高 (cm)" id="height-${cargo.id}" min="1">
        </div>
        <div class="cargo-quantity">
            <input type="number" placeholder="數量" id="quantity-${cargo.id}" min="1">
        </div>
        <div class="cargo-options">
            <label>
                <input type="checkbox" id="stackable-${cargo.id}">
                <span>可堆疊</span>
            </label>
            <label>
                <input type="checkbox" id="rotatable-${cargo.id}">
                <span>可旋轉</span>
            </label>
        </div>
    `;
    document.getElementById('cargoList').appendChild(cargoItem);

    document.getElementById(`name-${cargo.id}`).value = cargo.name;
    document.getElementById(`length-${cargo.id}`).value = cargo.length;
    document.getElementById(`width-${cargo.id}`).value = cargo.width;
    document.getElementById(`height-${cargo.id}`).value = cargo.height;
    document.getElementById(`quantity-${cargo.id}`).value = cargo.quantity;
    document.getElementById(`stackable-${cargo.id}`).checked = cargo.stackable;
    document.getElementById(`rotatable-${cargo.id}`).checked = cargo.rotatable;
}

function addCargo(cargo) {
    cargo.id = nextCargoId++;
    cargoData.push(cargo);
    createCargoRow(cargo);
}

function addCargoItem() {
    addCargo({
        name: `貨物${cargoData.length + 1}`,
        length: 100,
        width: 100,
        height: 80,
        quantity: 1,
        stackable: true,
        rotatable: false
    });
    invalidateResult();
}

function removeCargoItem(id) {
    const element = document.getElementById(`cargo-${id}`);
    if (element) element.remove();
    cargoData = cargoData.filter(item => item.id !== id);
    invalidateResult();
}

// 重置視角＝重新框住目前的載具（而非回到開檔時的貨櫃視角）
function resetView() {
    framedSize = null;
    frameContainer();
}

function clearAll() {
    cargoData = [];
    document.getElementById('cargoList').innerHTML = '';
    clearCargoMeshes();
    invalidateResult();
}

function loadExample() {
    clearAll();

    const exampleData = [
        { name: 'MB1', length: 203, width: 158, height: 173, quantity: 1, stackable: true, rotatable: false },
        { name: 'MB2', length: 242, width: 176, height: 188, quantity: 1, stackable: true, rotatable: false },
        { name: 'MD1', length: 324, width: 197, height: 222, quantity: 1, stackable: true, rotatable: true },
        { name: 'ME1', length: 91, width: 98, height: 143, quantity: 2, stackable: true, rotatable: false },
        { name: 'ME3', length: 86, width: 92, height: 82, quantity: 1, stackable: false, rotatable: false },
        { name: 'ME5', length: 139, width: 157, height: 152, quantity: 1, stackable: true, rotatable: true }
    ];

    exampleData.forEach(cargo => addCargo({ ...cargo }));
    calculateLoading();
}

// 從輸入欄位同步 cargoData
function updateCargoData() {
    cargoData.forEach(cargo => {
        const read = suffix => document.getElementById(`${suffix}-${cargo.id}`);
        const nameInput = read('name');
        const lengthInput = read('length');
        const widthInput = read('width');
        const heightInput = read('height');
        const quantityInput = read('quantity');
        const stackableInput = read('stackable');
        const rotatableInput = read('rotatable');

        if (nameInput) cargo.name = nameInput.value.trim() || `貨物${cargo.id}`;
        if (lengthInput) cargo.length = parseFloat(lengthInput.value);
        if (widthInput) cargo.width = parseFloat(widthInput.value);
        if (heightInput) cargo.height = parseFloat(heightInput.value);
        if (quantityInput) cargo.quantity = Math.max(1, parseInt(quantityInput.value) || 1);
        if (stackableInput) cargo.stackable = stackableInput.checked;
        if (rotatableInput) cargo.rotatable = rotatableInput.checked;
    });
}

function applyGlobalSettings() {
    const globalStackable = document.getElementById('globalStackable').checked;
    const globalRotatable = document.getElementById('globalRotatable').checked;

    cargoData.forEach(cargo => {
        const stackableInput = document.getElementById(`stackable-${cargo.id}`);
        const rotatableInput = document.getElementById(`rotatable-${cargo.id}`);
        if (stackableInput) {
            stackableInput.checked = globalStackable;
            cargo.stackable = globalStackable;
        }
        if (rotatableInput) {
            rotatableInput.checked = globalRotatable;
            cargo.rotatable = globalRotatable;
        }
    });
    invalidateResult();
}

// ============================================================
// 初始化
// ============================================================
window.addEventListener('DOMContentLoaded', () => {
    if (typeof THREE === 'undefined' || typeof THREE.OrbitControls === 'undefined') {
        document.getElementById('canvas-container').innerHTML =
            '<div class="webgl-error">⚠️ 無法載入 3D 引擎（Three.js CDN）。<br>請確認網路連線後重新整理頁面。</div>';
        return;
    }

    // 貨物清單任何輸入變動都讓舊結果失效
    document.getElementById('cargoList').addEventListener('input', () => {
        updateCargoData();
        invalidateResult();
    });

    buildCarrierRows();
    initScene();
    createContainer();
    updateStats();
});
    </script>
</body>
